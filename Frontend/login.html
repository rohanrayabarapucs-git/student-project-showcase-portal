<!DOCTYPE html>
<html>
<head>
    <title>Login - Project Showcase</title>
    <link rel="stylesheet" href="css/styles.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="auth-body">

<div class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <i class="fas fa-laptop-code auth-logo"></i>
            <h2>Project Showcase</h2>
            <p>Register or Login to continue</p>
        </div>

        <!-- Registration Form -->
        <div class="form-section">
            <h3><i class="fas fa-user-plus"></i> Register New Account</h3>
            <div class="form-group">
                <input type="text" id="regName" placeholder="Full Name">
            </div>
            <div class="form-group">
                <input type="email" id="regEmail" placeholder="Email Address">
            </div>
            <div class="form-group">
                <input type="password" id="regPassword" placeholder="Password">
            </div>
            <div class="form-group">
                <select id="regRole">
                    <option value="student">Student</option>
                    <option value="faculty">Faculty</option>
                </select>
            </div>
            <button type="button" onclick="register()" class="auth-button">
                <i class="fas fa-user-plus"></i> Register
            </button>
        </div>

        <div class="divider">OR</div>

        <!-- Login Form -->
        <div class="form-section">
            <h3><i class="fas fa-sign-in-alt"></i> Login</h3>
            <div class="form-group">
                <input type="email" id="email" placeholder="Email Address">
            </div>
            <div class="form-group">
                <input type="password" id="password" placeholder="Password">
            </div>
            <div class="form-group">
                <select id="role">
                    <option value="student">Student</option>
                    <option value="faculty">Faculty</option>
                </select>
            </div>
            <button type="button" onclick="login()" class="auth-button">
                <i class="fas fa-sign-in-alt"></i> Login
            </button>
        </div>
    </div>
</div>

<script src="js/script.js"></script>
</body>
</html>
