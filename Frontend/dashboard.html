<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard - Project Showcase</title>
    <link rel="stylesheet" href="css/styles.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-logo">
                <i class="fas fa-laptop-code"></i>
                Student Dashboard
            </div>
            <div class="nav-links">
                <a href="index.html" class="nav-link">Home</a>
                <a href="#" class="nav-link" onclick="logout()">Logout</a>
            </div>
        </div>
    </nav>

    <div class="dashboard-container">
        <aside class="sidebar">
            <div class="sidebar-menu">
                <a href="#add-project" class="menu-item active" onclick="showSection('add-project')">
                    <i class="fas fa-plus-circle"></i>
                    Add Project
                </a>
                <a href="#my-projects" class="menu-item" onclick="showSection('my-projects')">
                    <i class="fas fa-list"></i>
                    My Projects
                </a>
                <a href="#profile" class="menu-item" onclick="showSection('profile')">
                    <i class="fas fa-user"></i>
                    Profile
                </a>
            </div>
        </aside>

        <main class="dashboard-main">
            <!-- Add Project Section -->
            <section id="add-project" class="dashboard-section active">
                <div class="section-header">
                    <h2><i class="fas fa-plus-circle"></i> Add New Project</h2>
                    <p>Share your amazing work with the community</p>
                </div>

                <form class="project-form" onsubmit="event.preventDefault(); addProject();">
                    <div class="form-grid">
                        <div class="form-group">
                            <label for="title">
                                <i class="fas fa-heading"></i>
                                Project Title
                            </label>
                            <input type="text" id="title" placeholder="Enter project title" required>
                        </div>

                        <div class="form-group">
                            <label for="category">
                                <i class="fas fa-tags"></i>
                                Category
                            </label>
                            <select id="category" required>
                                <option value="">Select category</option>
                                <option value="Web Development">Web Development</option>
                                <option value="Mobile App">Mobile App</option>
                                <option value="AI/ML">AI/ML</option>
                                <option value="IoT">IoT</option>
                                <option value="Desktop App">Desktop App</option>
                                <option value="Game Development">Game Development</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="batch">
                                <i class="fas fa-calendar-alt"></i>
                                Batch
                            </label>
                            <input type="text" id="batch" placeholder="e.g., 2023-2024" required>
                        </div>

                        <div class="form-group">
                            <label for="github">
                                <i class="fab fa-github"></i>
                                GitHub Link
                            </label>
                            <input type="url" id="github" placeholder="https://github.com/username/repo" required>
                        </div>

                        <div class="form-group full-width">
                            <label for="description">
                                <i class="fas fa-align-left"></i>
                                Project Description
                            </label>
                            <textarea id="description" placeholder="Describe your project, features, and what problem it solves..." rows="4" required></textarea>
                        </div>

                        <div class="form-group full-width">
                            <label for="technologies">
                                <i class="fas fa-code"></i>
                                Technologies Used (comma separated)
                            </label>
                            <input type="text" id="technologies" placeholder="e.g., React, Node.js, MongoDB, Python" required>
                        </div>

                        <div class="form-group full-width">
                            <label for="screenshots">
                                <i class="fas fa-images"></i>
                                Project Screenshots (Max 5 images)
                            </label>
                            <input type="file" id="screenshots" multiple accept="image/*">
                            <small>Select up to 5 screenshots of your project</small>
                        </div>
                    </div>

                    <button type="submit" class="submit-button">
                        <i class="fas fa-paper-plane"></i>
                        Submit Project
                    </button>
                </form>
            </section>

            <!-- My Projects Section -->
            <section id="my-projects" class="dashboard-section">
                <div class="section-header">
                    <h2><i class="fas fa-list"></i> My Projects</h2>
                    <p>Manage your submitted projects</p>
                </div>
                <div id="my-projects-list" class="projects-list"></div>
            </section>

            <!-- Profile Section -->
            <section id="profile" class="dashboard-section">
                <div class="section-header">
                    <h2><i class="fas fa-user"></i> My Profile</h2>
                    <p>Manage your account information</p>
                </div>
                <div class="profile-card">
                    <div class="profile-info">
                        <div class="profile-avatar">
                            <i class="fas fa-user-graduate"></i>
                        </div>
                        <div class="profile-details">
                            <h3 id="userName">Student Name</h3>
                            <p id="userEmail">email@example.com</p>
                            <p class="role-badge student">Student</p>
                        </div>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
